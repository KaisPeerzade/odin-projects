<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>

<body>

    <header>
        <h1>Weather App</h1>

        <form id="search-form">
            <input
                type="text"
                id="location-input"
                placeholder="Enter a city"
                required
            >

            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <div id="loading"></div>

        <div id="weather-container">

            <h2 id="location"></h2>

            <div id="weather-condition"></div>

            <div id="temperature"></div>

            <div id="feels-like"></div>

            <div class="details">
                <p id="humidity"></p>
                <p id="wind"></p>
                <p id="high-low"></p>
            </div>

            <div class="temperature-buttons">
                <button id="celsius-btn">°C</button>
                <button id="fahrenheit-btn">°F</button>
            </div>

        </div>

        <p id="error-message"></p>
    </main>

</body>
</html>
